name: Produce one system design reel
on:
  workflow_call:
    inputs:
      lesson_id:
        required: true
        type: string
      job_token:
        default: ''
        type: string
      worker_url:
        default: ''
        type: string
      dry_run:
        default: true
        type: boolean
      upload_media:
        default: true
        type: boolean
      prepare_only:
        default: false
        type: boolean
      provider:
        default: approved
        type: string
    secrets:
      AUTOPILOT_CLOUDINARY_URL:
        required: false
      GEMINI_API_KEY:
        required: false
      AUTOPILOT_CALLBACK_TOKEN:
        required: false
      AUTOPILOT_WORKER_URL:
        required: false
  workflow_dispatch:
    inputs:
      lesson_id:
        description: Curriculum lesson ID
        required: true
        default: lesson-01
      job_token:
        description: Scheduler claim (empty for dry runs)
        default: ''
      worker_url:
        description: Scheduler URL (must match configured secret)
        default: ''
      dry_run:
        description: Report pilot result without publishing
        type: boolean
        default: true
      upload_media:
        description: Upload validated media to Cloudinary
        type: boolean
        default: true
      prepare_only:
        description: Validate a script only, without narration, render, upload or publication
        type: boolean
        default: false
      provider:
        description: Content provider (approved requires a reviewed story v2 lesson file)
        type: choice
        options: [gemini, approved]
        default: gemini
permissions:
  contents: read
concurrency:
  # All lessons share the Google project's model quotas, including manual jobs.
  group: reels-gemini-production
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3-flash-preview' }}
      CLOUDINARY_URL: ${{ secrets.AUTOPILOT_CLOUDINARY_URL }}
      AUTOPILOT_CALLBACK_TOKEN: ${{ secrets.AUTOPILOT_CALLBACK_TOKEN }}
      AUTOPILOT_WORKER_URL: ${{ secrets.AUTOPILOT_WORKER_URL }}
      DO_NOT_TRACK: '1'
      LESSON_ID: ${{ inputs.lesson_id }}
      JOB_TOKEN: ${{ inputs.job_token }}
      WORKER_URL: ${{ inputs.worker_url }}
      DRY_RUN: ${{ inputs.dry_run }}
      UPLOAD_MEDIA: ${{ inputs.upload_media }}
      CONTENT_PROVIDER: ${{ inputs.provider || 'gemini' }}
      PREPARE_ONLY: ${{ inputs.prepare_only || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - name: Validate input before filesystem or network operations
        run: |
          python -c 'import os,re; assert re.fullmatch(r"lesson-(0[1-9]|[1-5][0-9]|60)",os.environ["LESSON_ID"])'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1
          npm ci
          pip install --timeout 120 -r automation/requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            .autopilot/models
            ~/.cache/puppeteer
          key: reel-models-linux-varo-tiny-en-v2-hf-0.8.198
      - name: Restore completed narration from prior attempts
        id: progress-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .autopilot/runs/${{ inputs.lesson_id }}/content.json
            .autopilot/runs/${{ inputs.lesson_id }}/content-source.json
            .autopilot/runs/${{ inputs.lesson_id }}/script-progress.json
            .autopilot/runs/${{ inputs.lesson_id }}/script-attempts.json
            .autopilot/runs/${{ inputs.lesson_id }}/creative-feedback.json
            .autopilot/runs/${{ inputs.lesson_id }}/speech-*.json
            .autopilot/runs/${{ inputs.lesson_id }}/alignment-*.json
            .autopilot/runs/${{ inputs.lesson_id }}/audio.json
            .autopilot/runs/${{ inputs.lesson_id }}/assets
          key: reel-progress-v3-${{ inputs.lesson_id }}-${{ hashFiles('automation/config.json', 'automation/content.py', 'automation/creative-policy.json', 'automation/story_contract.py', 'automation/gemini_voice.py', 'automation/voice.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            reel-progress-v3-${{ inputs.lesson_id }}-${{ hashFiles('automation/config.json', 'automation/content.py', 'automation/creative-policy.json', 'automation/story_contract.py', 'automation/gemini_voice.py', 'automation/voice.py') }}-
            reel-progress-v3-${{ inputs.lesson_id }}-
      - name: Validate and produce (no Instagram credentials on this runner)
        run: |
          args=(--lesson "$LESSON_ID" --provider "$CONTENT_PROVIDER" --resume)
          if [ "$PREPARE_ONLY" = "true" ]; then args+=(--prepare-only); fi
          if [ "$UPLOAD_MEDIA" = "true" ]; then args+=(--upload); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$JOB_TOKEN" ]; then args+=(--job-token "$JOB_TOKEN"); fi
          if [ -n "$WORKER_URL" ]; then args+=(--worker-url "$WORKER_URL"); fi
          python -m automation.produce "${args[@]}"
      - name: Save completed narration even when generation fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .autopilot/runs/${{ inputs.lesson_id }}/content.json
            .autopilot/runs/${{ inputs.lesson_id }}/content-source.json
            .autopilot/runs/${{ inputs.lesson_id }}/script-progress.json
            .autopilot/runs/${{ inputs.lesson_id }}/script-attempts.json
            .autopilot/runs/${{ inputs.lesson_id }}/creative-feedback.json
            .autopilot/runs/${{ inputs.lesson_id }}/speech-*.json
            .autopilot/runs/${{ inputs.lesson_id }}/alignment-*.json
            .autopilot/runs/${{ inputs.lesson_id }}/audio.json
            .autopilot/runs/${{ inputs.lesson_id }}/assets
          key: ${{ steps.progress-cache.outputs.cache-primary-key }}
      - name: Retain review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ inputs.lesson_id }}-${{ github.run_id }}
          path: |
            .autopilot/runs/**/reel.mp4
            .autopilot/runs/**/cover.png
            .autopilot/runs/**/cover.jpg
            .autopilot/runs/**/cover.json
            .autopilot/runs/**/review-*.png
            .autopilot/runs/**/result.json
            .autopilot/runs/**/script-attempts.json
            .autopilot/runs/**/script-progress.json
            .autopilot/runs/**/creative-review.json
            .autopilot/runs/**/creative-frames/*.jpg
            .autopilot/runs/**/story-evidence.json
            .autopilot/runs/**/STORYBOARD.md
            .autopilot/runs/**/SPEC.md
            .autopilot/runs/**/check.json
            .autopilot/runs/**/content.json
            .autopilot/runs/**/audio.json
            .autopilot/runs/**/alignment-*.json
            .autopilot/runs/**/captions.srt
            .autopilot/runs/**/script-fallback.json
            .autopilot/runs/**/generation-error.json
            .autopilot/runs/**/creative-feedback.json
          retention-days: 7
          if-no-files-found: ignore
